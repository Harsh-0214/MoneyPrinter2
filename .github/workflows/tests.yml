# Runs the unit tests on every push / pull request (no MT5 terminal or market data needed:
# the tests use synthetic data and fake MT5 objects).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest          # MetaTrader5 package is Windows-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q
