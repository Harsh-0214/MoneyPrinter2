# ============================================================
#  fxbot configuration - every tunable number lives here
# ============================================================

data:
  path: data/EURUSD_M1_histdata.csv   # 5 years of M1 bars from histdata.com (2021-2025)
  source_tz: "UTC"            # histdata MetaTrader export is UTC (converted in combine_histdata.py)
                              #   Switch back to data/EURUSD_M5.csv + source_tz: NY+7 for live replay
  timeframe: 5min             # bars the strategy runs on (resampled from the file)
  start: null                 # e.g. "2022-01-01"  (null = from beginning of file)
  end: null                   # e.g. "2023-12-31"  (null = to end of file)

account:
  starting_equity: 50000      # match the FOREX.com demo balance

costs:
  spread_pips: 1.0            # minimum spread charged on every trade
  use_data_spread: true       # if the file has a spread column, use it when it's wider
  rollover_spread_pips: 3.0   # spread around the 5pm New York rollover (it widens a lot)
  slippage_pips: 0.2          # extra cost on market and stop fills
  commission_per_lot_per_side: 0.0   # standard accounts: 0 (cost is in the spread)
                                     # raw/ECN accounts: often ~3.5 USD

risk:
  risk_per_trade_pct: 0.5     # % of equity lost if the stop is hit
  max_daily_loss_pct: 2.0     # kill switch: no new trades today after this loss
  max_leverage: 10            # hard cap on position notional / equity
  min_units: 1000             # size is rounded down to micro lots (1,000 units)
  news_file: null             # optional CSV of high-impact news times (UTC), column "time"
  news_blackout_minutes: 30   # no new entries this many minutes either side of news

strategy:
  name: london_sweep          # london_breakout | london_sweep | ny_breakout | prev_day_breakout | mean_reversion

  # --- Shared times (London local, DST handled) ---
  range_start: "00:00"
  range_end: "08:00"
  entry_cutoff: "11:00"
  session_exit: "16:00"
  max_trades_per_day: 1

  # --- London Breakout params (used when name: london_breakout) ---
  buffer_pips: 1.0
  min_range_pips: 20
  max_range_pips: 60
  stop_mode: range
  atr_period: 14
  atr_stop_mult: 1.5
  reward_risk: 1.0
  ema_filter: false
  ema_period: 50

  # --- London Sweep params (used when name: london_sweep) ---
  sweep_window_start: "08:00"
  sweep_window_end: "10:30"
  sweep_min_pips: 1.0
  sweep_max_pips: 20.0          # allow sweeps up to 20 pips past Asian range
  swing_k: 3                   # 3 bars each side for swing confirmation (stricter = higher win rate)
  bos_buffer_pips: 0.5
  max_bars_after_sweep: 12
  require_close_inside_range: true
  stop_buffer_pips: 1.0
  max_stop_pips: 25
  target_mode: opposite_range  # opposite_range | rr
  min_rr: 1.5
  ema_filter: false             # daily EMA trend filter (doesn't help this reversal strategy)
  daily_ema_period: 10          # days used if ema_filter: true
  skip_days: [0, 1, 4]         # skip Mon/Tue/Fri — only trade Wed+Thu (5-year grid winner)
  smt_filter: false             # SMT cuts trades too far (~3/yr); toggle true when desired
  smt_min_pips: 1.0             # GBP must exceed its Asian range by this much to count as "swept"

# --- SMT divergence pair (GBPUSD for EURUSD strategy) ---
# To enable: 1) download GBPUSD M1 from histdata.com into data/histdata_gbpusd/
#            2) run: python combine_histdata.py --symbol GBPUSD
#            3) set strategy.smt_filter: true
smt:
  path: data/GBPUSD_M1_histdata.csv
  source_tz: "UTC"
  timeframe: 5min

output:
  dir: results

live:
  symbol: "EURUSD."          # FOREX.com Canada uses a trailing dot
  server_tz: "Europe/Helsinki"  # broker server timezone (MT5 uses this for bar timestamps)
  magic: 12345               # unique number so the bot only manages its own positions
  allow_live: false          # must be true AND --allow-live flag set to run on a real account
