# ============================================================
#  fxbot configuration - every tunable number lives here
# ============================================================

data:
  path: data/EURUSD_M1_histdata.csv   # 5 years of M1 bars from histdata.com (2021-2025)
  source_tz: "UTC"            # histdata MetaTrader export is UTC (converted in combine_histdata.py)
                              #   Switch back to data/EURUSD_M5.csv + source_tz: NY+7 for live replay
  timeframe: 5min             # bars the strategy runs on (resampled from the file)
  start: null                 # e.g. "2022-01-01"  (null = from beginning of file)
  end: null                   # e.g. "2023-12-31"  (null = to end of file)

account:
  starting_equity: 50000      # match the FOREX.com demo balance

costs:
  spread_pips: 1.0            # minimum spread charged on every trade
  use_data_spread: true       # if the file has a spread column, use it when it's wider
  rollover_spread_pips: 3.0   # spread around the 5pm New York rollover (it widens a lot)
  slippage_pips: 0.2          # extra cost on market and stop fills
  swap_long_per_lot: -8.0     # overnight financing, USD per 100k per night (negative = paid)
  swap_short_per_lot: -2.0    #   pessimistic EURUSD values; only multi-day trades pay it
  commission_per_lot_per_side: 0.0   # standard accounts: 0 (cost is in the spread)
                                     # raw/ECN accounts: often ~3.5 USD

risk:
  risk_per_trade_pct: 1.0     # % of equity lost if the stop is hit (was 0.5; 1% backtest:
                              #   ~5.5%/yr, max DD -13.4% over 2021-25)
  max_daily_loss_pct: 2.0     # kill switch: no new trades today after this loss
  max_leverage: 10            # hard cap on position notional / equity
  min_units: 1000             # size is rounded down to micro lots (1,000 units)
  news_file: null             # optional CSV of high-impact news times (UTC), column "time"
  news_blackout_minutes: 30   # no new entries this many minutes either side of news

# ---------------------------------------------------------------
#  Multi-strategy morning stack with scored proposal routing
#
#  How routing works:
#    - Each strategy evaluates setup quality and returns a scored proposal.
#    - The highest-scoring proposal on each bar is executed.
#    - LondonSweep (score 100-130) always beats LondonBreakout (score 60-80).
#    - LondonBreakout.propose() defers until defer_until (10:30) so the
#      Sweep has a full 2.5h window to form first.  Only if no Sweep fires
#      by 10:30 does the Breakout get a chance to propose.
#    - The Breakout also acts as a false-breakout filter: at defer_until it
#      checks price is STILL beyond the range (reversals are skipped).
#
#  NY Open Breakout tested on 5 years — loses money in every configuration.
#  Dropped permanently.
# ---------------------------------------------------------------
strategies:
  morning:
    - name: london_sweep
      range_start: "00:00"
      range_end: "08:00"
      entry_cutoff: "11:00"
      session_exit: "16:00"
      max_trades_per_day: 1
      sweep_window_start: "08:00"
      sweep_window_end: "10:30"
      sweep_min_pips: 1.0
      sweep_max_pips: 15.0
      swing_k: 2
      bos_buffer_pips: 0.5
      max_bars_after_sweep: 12
      require_close_inside_range: true
      stop_buffer_pips: 1.0
      max_stop_pips: 25
      target_mode: opposite_range
      min_rr: 1.5
      reward_risk: 2.0
      ema_filter: true           # daily trend filter: sell only below / buy only above the
      daily_ema_period: 50       #   50-day average of daily closes (also used by the Breakout).
                                 #   Nov 2026: any length 30-200 gave PF 1.27-1.36 vs 1.17 without.
      skip_days: [0]             # skip Monday only: lost in 4 of 5 years (2021-25). Tuesday was
                                 # net positive, so it trades again (Nov 2026: +11.7% -> +16.2%)
      smt_filter: true           # GBPUSD now a live pair → SMT divergence re-enabled as hard filter
      smt_min_pips: 1.0
      trail_to_breakeven_rr: 1.0 # move stop to entry when price is 1R ahead (breakeven protection)

    - name: london_breakout      # fallback: fires only after sweep window closes (10:30)
      range_start: "00:00"
      range_end: "08:00"
      entry_cutoff: "11:00"
      session_exit: "16:00"
      max_trades_per_day: 1
      min_range_pips: 22         # Nov 2026 sweep (trend filter on, real spreads): 20-25 all
                                 #   +13-15%; 22 = most profit, 65 trades/yr, 1 losing year
      max_range_pips: 80
      buffer_pips: 0.5
      reward_risk: 2.0
      stop_mode: range
      atr_period: 14
      atr_stop_mult: 1.5
      ema_filter: false
      skip_days: [0]             # Monday only (see london_sweep)
      daily_trend_filter: true   # same 50-day trend filter as the Sweep
      defer_until: "10:30"       # wait for sweep window to close before proposing
      max_defer_extension_pips: 15  # skip if price ran >15 pips beyond range by 10:30
      trail_to_breakeven_rr: 1.0 # stop -> entry at +1R. (Before the ownership fix the Sweep
                                 # was silently doing this to Breakout trades; now explicit.)

  afternoon: []                  # NY Open tested and dropped — loses on all configs

# Legacy single-strategy block (used by tests and direct run_backtest calls)
strategy:
  name: london_sweep
  range_start: "00:00"
  range_end: "08:00"
  entry_cutoff: "11:00"
  session_exit: "16:00"
  max_trades_per_day: 1
  sweep_window_start: "08:00"
  sweep_window_end: "10:30"
  sweep_min_pips: 1.0
  sweep_max_pips: 15.0
  swing_k: 2
  bos_buffer_pips: 0.5
  max_bars_after_sweep: 12
  require_close_inside_range: true
  stop_buffer_pips: 1.0
  max_stop_pips: 25
  target_mode: opposite_range
  min_rr: 1.5
  reward_risk: 2.0
  ema_filter: false
  daily_ema_period: 10
  skip_days: [0, 1]
  smt_filter: false
  smt_min_pips: 1.0
  # London Breakout params (used when strategy.name = london_breakout)
  buffer_pips: 1.0
  min_range_pips: 20
  max_range_pips: 80
  stop_mode: range
  atr_period: 14
  atr_stop_mult: 1.5
  ema_period: 50

# --- SMT divergence pair (GBPUSD for EURUSD strategy) ---
# Used both as the SMT confirmation feed AND as a second trading pair.
smt:
  path: data/GBPUSD_M1_histdata.csv
  source_tz: "UTC"
  timeframe: 5min

# --- Multi-pair backtest (run_backtest_multi_pair in backtest.py) ---
# Each pair runs the same strategies block with its own data and SMT feed.
# If a data file is missing the pair is skipped with a warning.
# To add more pairs: append a block with symbol, data, and optional smt.
pairs:
  - symbol: EURUSD
    spread_pips: 1.4             # typical FOREX.com demo spread at London open (seen live Nov 2026)
    data:
      path: data/EURUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 5min
    smt:
      path: data/GBPUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 5min
    sleeves:                     # extra strategies: own position + magic (12445), own bot
      - name: pullback           # daily swing pullback: buy dips in uptrends, sell rallies in downtrends
        data: {timeframe: 1h}
        warmup_days: 320         # needs 100+ trading days of history at startup
        strategies:
          morning:
            - name: daily_pullback
              trend_sma: 100     # trend = daily close vs 100-day average
              rsi_period: 2      # entry: 2-day RSI < 10 (uptrend) or > 90 (downtrend)
              oversold: 10
              overbought: 90
              exit_sma: 5        # exit: close back above / below the 5-day average
              max_hold_days: 10
              stop_atr: 3.0      # protective stop 3x daily ATR
          afternoon: []

  - symbol: GBPUSD
    spread_pips: 2.0             # typical FOREX.com demo spread at London open (seen live Nov 2026)
    data:
      path: data/GBPUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 5min
    smt:
      path: data/EURUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 5min
    sleeves:
      - name: pullback           # magic 12446
        data: {timeframe: 1h}
        warmup_days: 320         # needs 200+ trading days for the 200-day average
        strategies:
          morning:
            - name: daily_pullback
              trend_sma: 200     # GBPUSD: 200-day trend (PF 1.87, 4/5 years; 100-day was weak)
              rsi_period: 2
              oversold: 10
              overbought: 90
              exit_sma: 5
              max_hold_days: 10
              stop_atr: 3.0
          afternoon: []

  # --- Gold: its own strategy (daily trend following), not the London stack ---
  # Arsenal research Nov 2026 (run_arsenal.py): London stack loses on gold; daily
  # Donchian trend following (buy-only) is the best gold strategy found:
  # 2021-25 +14.9%, max DD -4.3%, PF 3.55 at 1% risk, $0.80 spread, -6.5%/yr long financing.
  - symbol: XAUUSD
    broker_symbol: XAUUSD        # FOREX.com gold has NO trailing dot
    spread_pips: 8.0             # $0.80 (pip = $0.10), measured on the demo Nov 2026
    instrument:
      pip: 0.1
      min_units: 1               # units = ounces; FOREX.com: 1 lot = 1 oz, min 0.1 lot
    data:
      path: data/XAUUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 1h              # decides once per day; 1h bars for stops/trailing
    costs:                       # gold financing ~ % of position value (demo shows 0; estimate)
      swap_long_per_lot: 0.0
      swap_short_per_lot: 0.0
      swap_long_pct: -6.5
      swap_short_pct: -1.5
    warmup_days: 120             # live: replay ~120 days at startup to rebuild the 55-day channel
    strategies:
      morning:
        - name: trend_follow
          signal: donchian
          entry_days: 55         # buy when a daily close beats the highest high of 55 days
          exit_days: 20          # sell when a daily close drops below the 20-day low
          atr_days: 20
          stop_atr: 2.0          # stop 2x daily ATR below entry, then trails the best price
          long_only: true        # shorts on gold lost money in every test
      afternoon: []
    sleeves:
      - name: fast               # magic 12447: faster gold trend, catches shorter trends
        warmup_days: 120
        strategies:
          morning:
            - name: trend_follow
              signal: donchian
              entry_days: 20     # 2021-25 alone: +18.1%, PF 2.94, max DD -3.6%
              exit_days: 10
              atr_days: 20
              stop_atr: 2.0
              long_only: true
          afternoon: []

  # AUDUSD tested Nov 2026 with unchanged params: 2021-23 +0.0%, 2024-25 +5.1%,
  # breakeven at 1.5-pip spread. Adds ~1%/yr but raises max DD -10.6% -> -13.4%.
  # Left disabled. Uncomment to include (no SMT partner -> SMT filter passes).
  # - symbol: AUDUSD
  #   data:
  #     path: data/AUDUSD_M1_histdata.csv
  #     source_tz: "UTC"
  #     timeframe: 5min

output:
  dir: results

live:
  symbol: "EURUSD."          # default symbol; run_live.py --pair X uses X + symbol_suffix
  symbol_suffix: "."         # FOREX.com Canada uses a trailing dot (EURUSD., GBPUSD.)
  server_tz: "Europe/Helsinki"  # broker server timezone (MT5 uses this for bar timestamps)
  magic: 12345               # base magic; each pair uses magic + its index in pairs:
  max_open_risk_pct: 5.0     # portfolio cap: all bots' open risk combined (on equity_cap) never exceeds this
  equity_cap: 50000          # size trades as if the account were this big (null = use real equity)
  allow_live: false          # must be true AND --allow-live flag set to run on a real account
