# ============================================================
#  fxbot configuration - every tunable number lives here
# ============================================================

data:
  path: data/EURUSD_M1_histdata.csv   # 5 years of M1 bars from histdata.com (2021-2025)
  source_tz: "UTC"            # histdata MetaTrader export is UTC (converted in combine_histdata.py)
                              #   Switch back to data/EURUSD_M5.csv + source_tz: NY+7 for live replay
  timeframe: 5min             # bars the strategy runs on (resampled from the file)
  start: null                 # e.g. "2022-01-01"  (null = from beginning of file)
  end: null                   # e.g. "2023-12-31"  (null = to end of file)

account:
  starting_equity: 50000      # match the FOREX.com demo balance

costs:
  spread_pips: 1.0            # minimum spread charged on every trade
  use_data_spread: true       # if the file has a spread column, use it when it's wider
  rollover_spread_pips: 3.0   # spread around the 5pm New York rollover (it widens a lot)
  slippage_pips: 0.2          # extra cost on market and stop fills
  swap_long_per_lot: -8.0     # overnight financing, USD per 100k per night (negative = paid)
  swap_short_per_lot: -2.0    #   pessimistic EURUSD values; only multi-day trades pay it
  commission_per_lot_per_side: 0.0   # standard accounts: 0 (cost is in the spread)
                                     # raw/ECN accounts: often ~3.5 USD

risk:
  risk_per_trade_pct: 3.0     # % of equity lost if the stop is hit. Nov 2026: 3% targets ~5%/month
                              #   (2021-25 sim with broker margin limits: avg 5.2%/mo, max DD -32%,
                              #   1-in-20 bad case -37%, 1-in-100 -46%; 2026: avg 4.9%/mo, DD -9%).
                              #   Was 1% (avg ~1.9%/mo, max DD -12%). Earlier note: (was 0.5; 1% backtest:
                              #   ~5.5%/yr, max DD -13.4% over 2021-25)
  max_daily_loss_pct: 6.0     # kill switch: no new trades today after this loss (2 full losses at 3%)
  max_leverage: 14            # hard cap on position notional / equity (70% of FOREX.com's 20:1 on FX)
  min_units: 1000             # size is rounded down to micro lots (1,000 units)
  min_stop_spreads: 0         # 0 = off. N = skip a trade whose stop is closer than N x the spread
                              #   (idea from day-trader-skill). Nov 2026: stops < 12 spreads averaged
                              #   ~0R (20 trades 2021-25, 4 in 2026), but with the rule at 12 the full
                              #   portfolio was unchanged (+167.8% vs +171.9%, same PF/DD): left off.
  news_file: null             # optional CSV of high-impact news times (UTC), column "time"
                              #   (legacy; applies to every market, honoured even with news_filter off)
  # --- high-impact news filter (fxbot/news.py). Blocks NEW entries only; open trades stay.
  news_filter: true           # ON (Nov 2026, run_news_test.py): +-30 min cost 0.3% of 69.4% over
                              #   2021-25 and left max DD unchanged, so it's a cheap guard against
                              #   news spikes the simulator doesn't model. +-60 min: +67.0%;
                              #   +-120 min: +62.2% and DD -11.9%; skipping NFP/FOMC days: +62.8%
                              #   with DD -7.0% (rejected: costs 6.6% and was 1 of 7 variants tried)
  news_blackout_minutes: 30   # no new entries this many minutes either side of news
  news_currencies: auto       # auto: EURUSD -> USD+EUR, GBPUSD -> USD+GBP, XAUUSD -> USD
                              #   (or a list, e.g. [USD], per pair via `risk:` under the pair)
  news_day_block: []          # event-name keywords whose whole London day is skipped, e.g. [payrolls, fomc]
  news_calendar: data/news/high_impact_2021_2025.csv   # backtests (build_news_calendar.py)
  news_refresh_hours: 4       # live: Forex Factory weekly feed, cached in data/news/
  news_protect: null          # open intraday trades before high-impact news: null (ride it), "close",
                              #   "breakeven" or "breakeven_or_close". Nov 2026, 2021-25 portfolio:
                              #   ride it +171.9% (DD -8.1%); breakeven +162.1%; close 20 min before
                              #   +158.1%; close 60 min +157.0%; BE-or-close +154.7%; no DD gain.
                              #   Breakouts get their best follow-through from the releases.

# ---------------------------------------------------------------
#  Multi-strategy morning stack with scored proposal routing
#
#  How routing works:
#    - Each strategy evaluates setup quality and returns a scored proposal.
#    - The highest-scoring proposal on each bar is executed.
#    - LondonSweep (score 100-130) always beats LondonBreakout (score 60-80).
#    - LondonBreakout.propose() defers until defer_until (10:30) so the
#      Sweep has a full 2.5h window to form first.  Only if no Sweep fires
#      by 10:30 does the Breakout get a chance to propose.
#    - The Breakout also acts as a false-breakout filter: at defer_until it
#      checks price is STILL beyond the range (reversals are skipped).
#
#  NY Open Breakout tested on 5 years — loses money in every configuration.
#  Dropped permanently.
# ---------------------------------------------------------------
strategies:
  morning:
    - name: london_sweep
      range_start: "00:00"
      range_end: "08:00"
      entry_cutoff: "11:00"
      session_exit: "16:00"
      max_trades_per_day: 1
      sweep_window_start: "08:00"
      sweep_window_end: "10:30"
      sweep_min_pips: 1.0
      sweep_max_pips: 15.0
      swing_k: 2
      bos_buffer_pips: 0.5
      max_bars_after_sweep: 12
      require_close_inside_range: true
      stop_buffer_pips: 1.0
      max_stop_pips: 25
      target_mode: opposite_range
      min_rr: 1.5
      reward_risk: 2.0
      ema_filter: true           # daily trend filter: sell only below / buy only above the
      daily_ema_period: 50       #   50-day average of daily closes (also used by the Breakout).
                                 #   Nov 2026: any length 30-200 gave PF 1.27-1.36 vs 1.17 without.
      skip_days: [0]             # skip Monday only: lost in 4 of 5 years (2021-25). Tuesday was
                                 # net positive, so it trades again (Nov 2026: +11.7% -> +16.2%)
      smt_filter: true           # GBPUSD now a live pair → SMT divergence re-enabled as hard filter
      smt_min_pips: 1.0
      trail_to_breakeven_rr: 1.0 # move stop to entry when price is 1R ahead (breakeven protection)

    - name: london_breakout      # fallback: fires only after sweep window closes (10:30)
      range_start: "00:00"
      range_end: "08:00"
      entry_cutoff: "11:00"
      session_exit: "20:00"      # Nov 2026: 20:00 vs 16:00 on 2021-25 EUR+GBP: +45% vs +30%,
                                 #   PF 1.39 vs 1.30, 1 losing year vs 2. No time exit was worse
                                 #   (+20%, PF 1.14, DD -19%): the London move is over by evening.
      max_trades_per_day: 1
      min_range_pips: 22         # Nov 2026 sweep (trend filter on, real spreads): 20-25 all
                                 #   +13-15%; 22 = most profit, 65 trades/yr, 1 losing year
      max_range_pips: 80
      buffer_pips: 0.5
      reward_risk: 2.0
      stop_mode: range
      atr_period: 14
      atr_stop_mult: 1.5
      ema_filter: false
      skip_days: [0]             # Monday only (see london_sweep)
      daily_trend_filter: true   # same 50-day trend filter as the Sweep
      defer_until: "10:30"       # wait for sweep window to close before proposing
      max_defer_extension_pips: 15  # skip if price ran >15 pips beyond range by 10:30
      trail_to_breakeven_rr: 1.0 # stop -> entry at +1R. (Before the ownership fix the Sweep
                                 # was silently doing this to Breakout trades; now explicit.)

  afternoon: []                  # NY Open tested and dropped — loses on all configs

# Legacy single-strategy block (used by tests and direct run_backtest calls)
strategy:
  name: london_sweep
  range_start: "00:00"
  range_end: "08:00"
  entry_cutoff: "11:00"
  session_exit: "16:00"
  max_trades_per_day: 1
  sweep_window_start: "08:00"
  sweep_window_end: "10:30"
  sweep_min_pips: 1.0
  sweep_max_pips: 15.0
  swing_k: 2
  bos_buffer_pips: 0.5
  max_bars_after_sweep: 12
  require_close_inside_range: true
  stop_buffer_pips: 1.0
  max_stop_pips: 25
  target_mode: opposite_range
  min_rr: 1.5
  reward_risk: 2.0
  ema_filter: false
  daily_ema_period: 10
  skip_days: [0, 1]
  smt_filter: false
  smt_min_pips: 1.0
  # London Breakout params (used when strategy.name = london_breakout)
  buffer_pips: 1.0
  min_range_pips: 20
  max_range_pips: 80
  stop_mode: range
  atr_period: 14
  atr_stop_mult: 1.5
  ema_period: 50

# --- SMT divergence pair (GBPUSD for EURUSD strategy) ---
# Used both as the SMT confirmation feed AND as a second trading pair.
smt:
  path: data/GBPUSD_M1_histdata.csv
  source_tz: "UTC"
  timeframe: 5min

# --- Multi-pair backtest (run_backtest_multi_pair in backtest.py) ---
# Each pair runs the same strategies block with its own data and SMT feed.
# If a data file is missing the pair is skipped with a warning.
# To add more pairs: append a block with symbol, data, and optional smt.
pairs:
  - symbol: EURUSD
    spread_pips: 1.4             # typical FOREX.com demo spread at London open (seen live Nov 2026)
    data:
      path: data/EURUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 15min           # Nov 2026: London stack on 15min vs 5min - 2021-25 PF 1.48 vs 1.30,
                                 #   DD -8.5% vs -13.5%; 2026 out-of-sample +4.1% vs +2.8% (11 vs 13
                                 #   trades). GBPUSD stays on 5min (more profit there over 2021-25).
    smt:
      path: data/GBPUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 15min           # SMT feed must match the pair's bars
    # EUR pullback sleeve (magic 12445) removed Nov 2026: wins small / loses big (3xATR stop),
    #   negative in 2026, and with tighter stops its worst year fell to -10.6%.

  - symbol: GBPUSD
    spread_pips: 2.0             # typical FOREX.com demo spread at London open (seen live Nov 2026)
    data:
      path: data/GBPUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 5min
    smt:
      path: data/EURUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 5min
    sleeves:
      - name: pullback           # magic 12446
        data: {timeframe: 1h}
        warmup_days: 320         # needs 200+ trading days for the 200-day average
        strategies:
          morning:
            - name: daily_pullback
              trend_sma: 200     # GBPUSD: 200-day trend (PF 1.87, 4/5 years; 100-day was weak)
              rsi_period: 2
              oversold: 10
              overbought: 90
              exit_sma: 5
              max_hold_days: 10
              stop_atr: 1.5      # Nov 2026: 1.5xATR (was 3): PF 1.61, 4/5 years, smaller losses
          afternoon: []

  # --- Gold: its own strategy (daily trend following), not the London stack ---
  # Arsenal research Nov 2026 (run_arsenal.py): London stack loses on gold; daily
  # Donchian trend following (buy-only) is the best gold strategy found:
  # 2021-25 +14.9%, max DD -4.3%, PF 3.55 at 1% risk, $0.80 spread, -6.5%/yr long financing.
  - symbol: XAUUSD
    broker_symbol: XAUUSD        # FOREX.com gold has NO trailing dot
    risk:                        # Nov 12 2026 (run_portfolio.py, real margin, live-style brake):
      risk_per_trade_pct: 4.0    #   gold + USDJPY at 4%, rest 3%: avg month 3.73 -> 3.92 (2021-23),
                                 #   6.05 -> 6.34 (2024-25), 6.50 -> 7.03 (2026); max DD -16.0/-18.7/
                                 #   -10.5 -> -17.2/-19.7/-8.6. The brake still cuts to 2/1/0.5%.
    spread_pips: 8.0             # $0.80 (pip = $0.10), measured on the demo Nov 2026
    instrument:
      pip: 0.1
      min_units: 1               # units = ounces; FOREX.com: 1 lot = 1 oz, min 0.1 lot
    data:
      path: data/XAUUSD_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 1h              # decides once per day; 1h bars for stops/trailing
    costs:                       # gold financing ~ % of position value (demo shows 0; estimate)
      swap_long_per_lot: 0.0
      swap_short_per_lot: 0.0
      swap_long_pct: -6.5
      swap_short_pct: -1.5
    warmup_days: 120             # live: replay ~120 days at startup to rebuild the 55-day channel
    strategies:
      morning:
        - name: trend_follow
          signal: donchian
          entry_days: 55         # buy when a daily close beats the highest high of 55 days
          exit_days: 20          # sell when a daily close drops below the 20-day low
          atr_days: 20
          stop_atr: 2.0          # stop 2x daily ATR below entry, then trails the best price
          long_only: true        # shorts on gold lost money in every test
      afternoon: []
    sleeves:
      - name: fast               # magic 12447: faster gold trend, catches shorter trends
        warmup_days: 120
        strategies:
          morning:
            - name: trend_follow
              signal: donchian
              entry_days: 20     # 2021-25 alone: +18.1%, PF 2.94, max DD -3.6%
              exit_days: 10
              atr_days: 20
              stop_atr: 2.0
              long_only: true
          afternoon: []
      # "Adding to winners" (Nov 2026): on the same signal as the main gold bot, buy a
      # second position once the trend is +0.5R in profit, stop at the main entry price,
      # then trail/exit like the main trade. Portfolio sim with margin + risk brake:
      # 2021-25 avg month 3.9% -> 4.9%, 2026 5.2% -> 7.5%, max DD unchanged (-21%).
      - name: add55              # magic 12547: adds to the 55-day trend
        warmup_days: 120
        strategies:
          morning:
            - name: trend_follow
              signal: donchian
              entry_days: 55
              exit_days: 20
              atr_days: 20
              stop_atr: 2.0
              long_only: true
              add_on_r: 0.5
          afternoon: []
      - name: add20              # magic 12647: adds to the 20-day trend
        warmup_days: 120
        strategies:
          morning:
            - name: trend_follow
              signal: donchian
              entry_days: 20
              exit_days: 10
              atr_days: 20
              stop_atr: 2.0
              long_only: true
              add_on_r: 0.5
          afternoon: []

  # --- USD/JPY: volatility breakout (Nov 2026 research, run_arsenal.py + grid) ---
  # Day's open +/- 0.9 x yesterday's range, 07:00-16:00 London, only with the 50-day
  # trend; stop 0.5 x yesterday's range; exit 21:00. All 96 grid settings profitable
  # 2021-25; this one: +31%, PF 1.56, DD -7.9%, 4/5 years. 2026 out-of-sample +4.2%,
  # PF 1.47. Monthly correlation with the rest of the portfolio -0.08.
  - symbol: USDJPY
    spread_pips: 1.6             # FOREX.com demo, Nov 2026
    risk:
      risk_per_trade_pct: 4.0    # see XAUUSD (Nov 12 2026)
    instrument:
      pip: 0.01
      min_units: 1000
      inverse_quote: true        # backtest: P/L in JPY converted to the USD account (live uses MT5)
    data:
      path: data/USDJPY_M1_histdata.csv
      source_tz: "UTC"
      timeframe: 15min
    costs:                       # pessimistic: longs earn no carry, shorts pay ~$10/lot/night
      swap_long_per_lot: 0.0
      swap_short_per_lot: -10.0
    warmup_days: 100             # live: replay ~100 days to rebuild the 50-day trend
    strategies:
      morning:
        - name: vol_breakout
          k: 0.9
          entry_start: "05:00"       # Nov 2026 window grid (start 03-07 x end 10-16): every window ending
          entry_end: "12:00"         #   12:00 beat 16:00 (12-16 London = US data/NY open whipsaw).
                                     #   05-12 vs 07-16: 2021-25 PF 2.35 vs 1.58, DD -5.0% vs -7.5%;
                                     #   2026 +6.8% vs +4.2%. Results/entry_windows.csv.
          exit_time: "21:00"
          stop_range: 0.5
          trend_sma: 50
          trail_to_breakeven_rr: 1.0  # stop -> entry at +1R. Fixed targets cut profit by half
                                      #   (best breakouts run past 2-3R before 21:00).
          skip_days: [0]
      afternoon: []

  # AUDUSD tested Nov 2026 with unchanged params: 2021-23 +0.0%, 2024-25 +5.1%,
  # breakeven at 1.5-pip spread. Adds ~1%/yr but raises max DD -10.6% -> -13.4%.
  # Left disabled. Uncomment to include (no SMT partner -> SMT filter passes).
  # - symbol: AUDUSD
  #   data:
  #     path: data/AUDUSD_M1_histdata.csv
  #     source_tz: "UTC"
  #     timeframe: 5min

output:
  dir: results

live:
  symbol: "EURUSD."          # default symbol; run_live.py --pair X uses X + symbol_suffix
  symbol_suffix: "."         # FOREX.com Canada uses a trailing dot (EURUSD., GBPUSD.)
  server_tz: "Europe/Helsinki"  # broker server timezone (MT5 uses this for bar timestamps)
  magic: 12345               # base magic; each pair uses magic + its index in pairs:
  max_open_risk_pct: 12.0    # portfolio cap: all bots' open risk combined (on equity_cap); 4 trades at 3%
  max_margin_used_pct: 70.0  # shrink/skip entries so all open trades use <= 70% of equity as margin
                             #   (FOREX.com stops out at 100% margin level, margin call at 120%)
  max_spread_mult: 2.5       # skip a new entry if the live spread > 2.5x the pair's normal spread_pips
                             #   (EURUSD 3.5 pips, GBPUSD 5.0, gold $2.00)
  risk_brake:                # smaller trades while the account is below its peak (% of equity_cap):
    - [8, 2.0]               #   8% down -> 2% risk per trade
    - [15, 1.0]              #   15% down -> 1%
    - [20, 0.5]              #   20% down -> 0.5%. Full 3% again once back within 8% of the peak.
                             # Nov 2026, 3,000 reshuffles of 2021-25 trades: avg ~4.2-4.5%/month,
                             #   worst 1-in-100 drawdown -24.8%, none past -30% (flat 3%: 41% did).
  max_drawdown_pct: 28.0     # last resort: no new trades at all 28% below the peak (open trades
                             #   at 0.5% risk can't take it past 30%). Never reached in the tests.
                             #   below its peak. Resume: delete data/state/peak_equity.json
  equity_cap: null           # null = size on the REAL account equity, so profits compound (and losses
                             #   shrink trades). Nov 2026 sim 2021-25: $50k -> ~$650k vs ~$200k with a
                             #   fixed $50k cap, max DD -19% vs -21%. Set a number to size as if the
                             #   account were that big (no compounding).
  allow_live: false          # must be true AND --allow-live flag set to run on a real account
